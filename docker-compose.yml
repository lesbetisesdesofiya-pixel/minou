# ─── Déploiement multi-sites : 1 dossier par restaurant ─────────────────────
# /opt/avepozo, /opt/avedji, /opt/legbassito (même code, .env et base propres).
# Chaque .env définit : SITE (avedji|legbassito|avepozo), APP_PORT (8080/8081/8082),
# APP_URL, DB_DATABASE, DB_PASSWORD, JWT_SECRET, API_KEY...
services:
  app:
    build: .
    container_name: ${SITE:-avepozo}-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - web

  db:
    image: mysql:8.0
    container_name: ${SITE:-avepozo}-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-opera_resto}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dbdata:

# Réseau du reverse-proxy Caddy existant (classinote-caddy-1) :
# Caddy route <site>.operatogo.net -> <site>-app:80 (HTTPS auto).
# Ex. : avepozo.operatogo.net -> avepozo-app:80 (voir deploy/caddy-operatogo.conf).
networks:
  web:
    external: true
    name: classinote_default
