# Reverse-proxy HÔTE (pas dans Docker) : avepozo.operatogo.net -> container opera-app:8080
# Installer sur le VPS : /etc/nginx/sites-available/avepozo.operatogo.net
# Activer : ln -s .../sites-available/avepozo.operatogo.net .../sites-enabled/ && nginx -t && systemctl reload nginx
# HTTPS   : certbot --nginx -d avepozo.operatogo.net
server {
    listen 80;
    server_name avepozo.operatogo.net;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
