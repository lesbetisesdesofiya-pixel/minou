# Reverse-proxy HÔTE (Caddy en Docker) : 1 bloc par restaurant.
# Installer sur le VPS : ajouter ces blocs dans /home/ubuntu/classinote/Caddyfile
# (ou copier ce fichier), puis :
#   docker exec classinote-caddy-1 caddy reload --config /etc/caddy/Caddyfile
# HTTPS automatique par Caddy (DNS A+AAAA pointant vers le VPS requis).
# Chaque stack tourne dans son dossier (/opt/avepozo, /opt/avedji, /opt/legbassito)
# avec SITE/APP_PORT propres : avepozo-app:80, avedji-app:80, legbassito-app:80
# (voir docker-compose.yml — tous sur le réseau classinote_default).

avepozo.operatogo.net {
	encode zstd gzip
	reverse_proxy avepozo-app:80
	log {
		output stdout
	}
}

avedji.operatogo.net {
	encode zstd gzip
	reverse_proxy avedji-app:80
	log {
		output stdout
	}
}

legbassito.operatogo.net {
	encode zstd gzip
	reverse_proxy legbassito-app:80
	log {
		output stdout
	}
}
